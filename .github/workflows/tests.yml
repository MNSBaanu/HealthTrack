name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build web app
        run: dotnet build HealthTrack.csproj --configuration Release
      - name: Run tests
        run: dotnet test Tests/HealthTrack.Tests.csproj --configuration Release --logger "console;verbosity=normal"
